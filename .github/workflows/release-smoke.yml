name: Release JAR smoke test

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: GitHub release asset ID for the prebuilt JAR in this repository
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of that JAR
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Test the release JAR on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the release test
        uses: actions/checkout@v7.0.1
      - name: Install Java 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Download and verify the same prebuilt JAR
        env:
          RELEASE_ASSET_ID: ${{ inputs.asset_id }}
          RELEASE_SHA256: ${{ inputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -LiteralPath test/ui-test-session.txt -Value 'Release smoke test did not start: the asset download or SHA-256 check failed.'
          if ($env:RELEASE_ASSET_ID -notmatch '^[0-9]+$') {
            throw 'asset_id must be a numeric GitHub release asset ID.'
          }
          if ($env:RELEASE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'sha256 must contain exactly 64 hexadecimal characters.'
          }
          $candidateDirectory = Join-Path $env:GITHUB_WORKSPACE '_temp/release-candidate'
          New-Item -ItemType Directory -Path $candidateDirectory -Force | Out-Null
          $candidateJar = Join-Path $candidateDirectory 'ted.jar'
          $assetUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$env:RELEASE_ASSET_ID"
          $headers = @{
            Accept = 'application/octet-stream'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -Uri $assetUrl -Headers $headers -OutFile $candidateJar
          $actualHash = (Get-FileHash -LiteralPath $candidateJar -Algorithm SHA256).Hash
          if ($actualHash -ine $env:RELEASE_SHA256) {
            throw "SHA-256 mismatch. Expected $env:RELEASE_SHA256; received $actualHash."
          }
          Write-Output "Verified prebuilt JAR SHA-256: $actualHash"
      - name: Run the JAR from a fresh folder
        run: ./test/run-release-smoke.ps1 -JarPath _temp/release-candidate/ted.jar
      - name: Print the console transcript
        if: always()
        run: |
          if (Test-Path -LiteralPath test/ui-test-session.txt) {
            Get-Content -LiteralPath test/ui-test-session.txt
          } else {
            Write-Output 'No console transcript was produced.'
          }
